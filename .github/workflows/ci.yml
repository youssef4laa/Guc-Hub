name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: List changed files
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Check scope
        run: |
          node tools/check-scope.mjs \
            --branch "${{ github.head_ref }}" \
            --files "${{ steps.changed.outputs.files }}" \
            ${{ contains(github.event.pull_request.labels.*.name, 'cross-track') && '--cross-track' || '' }}

  quality:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-fixtures

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test -- --ci

  # Builds a development client via EAS and runs the Maestro demo-mode smoke flow
  # against it. Needs EXPO_TOKEN and MAESTRO_CLOUD_API_KEY repo secrets — skips
  # cleanly (rather than failing) until a maintainer sets those up.
  e2e:
    name: Maestro smoke (demo mode)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event.repository != null && vars.EAS_E2E_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build development client (Android, EAS)
        run: eas build --platform android --profile development --non-interactive --wait

      - name: Run Maestro smoke flow on EAS build
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: build.apk
          workspace: .maestro

  # Publishes a preview/production build when main gets a real commit. Needs
  # EXPO_TOKEN — skips cleanly until a maintainer sets one up (see README).
  eas-build:
    name: EAS build (main)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' && vars.EAS_BUILD_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build --platform all --profile production --non-interactive --no-wait
