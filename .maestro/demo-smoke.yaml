appId: com.guchub.app
---
# Smoke flow for demo mode — run against a dev-client build with
# EXPO_PUBLIC_MODE=mock. Exercises the one thing that must never break: a
# reviewer/dev tapping "Try demo" and landing on a working Schedule tab.
- launchApp
- assertVisible: "Sign in to GUC Hub"
- tapOn: "Try demo"
- assertVisible: "Schedule"
- assertVisible: "NEXT CLASS"
- tapOn: "More"
- assertVisible: "Grades"
- assertVisible: "Coming soon"

# Walk every feature that is enabled in demo mode. Text assertions match the fake
# data in each feature's mock.ts.
- tapOn: "Grades"
- assertVisible: "Semester average.*"
- tapOn: "CMS"
- assertVisible: "CSEN 401.*"
- tapOn: "More"
- tapOn: "Exams"
- assertVisible: "Upcoming"
- tapOn: "More"
- tapOn: "Attendance"
- assertVisible: "Attended 21 of 22.*"
- tapOn: "More"
- tapOn: "Staff"
- assertVisible: "Dr. Mona Farouk"
- tapOn: "More"
- tapOn: "Transcript"
- assertVisible: "Cumulative GPA.*"
- tapOn: "More"
- tapOn: "Evaluations"
- assertVisible: "Rate all 5 stars"
- tapOn: "More"
- tapOn: "Glide"
- assertVisible: "Tap to start"
